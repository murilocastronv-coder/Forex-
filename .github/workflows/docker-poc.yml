name: MT5 Wine Docker POC
on:
  push:
    branches: [mt5-wine-render-poc]
  workflow_dispatch:
jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: mt5-wine-poc:test
